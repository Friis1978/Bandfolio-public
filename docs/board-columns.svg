<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180" font-family="Inter, -apple-system, sans-serif">
  <rect width="800" height="180" fill="#0f172a" rx="16"/>
  <text x="400" y="30" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700">Jira Kanban Board Columns</text>

  <!-- Column headers -->
  <rect x="10" y="50" width="88" height="110" rx="8" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
