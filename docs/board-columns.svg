  <text x="54" y="130" text-anchor="middle" fill="#64748b" font-size="9">You write</text>
  <text x="54" y="142" text-anchor="middle" fill="#64748b" font-size="9">the task</text>

  <rect x="108" y="50" width="88" height="110" rx="8" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="152" y="75" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="700">Spec</text>
  <text x="152" y="130" text-anchor="middle" fill="#64748b" font-size="9">Claude writes</text>
  <text x="152" y="142" text-anchor="middle" fill="#64748b" font-size="9">the spec</text>

  <rect x="206" y="50" width="88" height="110" rx="8" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="1"/>
  <text x="250" y="70" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700">Spec</text>
  <text x="250" y="84" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700">(approved)</text>
  <text x="250" y="130" text-anchor="middle" fill="#64748b" font-size="9">PM reviews</text>
  <text x="250" y="142" text-anchor="middle" fill="#64748b" font-size="9">and approves</text>

  <rect x="304" y="50" width="88" height="110" rx="8" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="348" y="75" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="700">Plan</text>
  <text x="348" y="130" text-anchor="middle" fill="#64748b" font-size="9">Claude writes</text>
  <text x="348" y="142" text-anchor="middle" fill="#64748b" font-size="9">the plan</text>

  <rect x="402" y="50" width="88" height="110" rx="8" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="1"/>
  <text x="446" y="70" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700">Plan</text>
  <text x="446" y="84" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700">(approved)</text>
  <text x="446" y="130" text-anchor="middle" fill="#64748b" font-size="9">PM reviews</text>
  <text x="446" y="142" text-anchor="middle" fill="#64748b" font-size="9">and approves</text>

  <rect x="500" y="50" width="88" height="110" rx="8" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="544" y="75" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="700">PR</text>
  <text x="544" y="130" text-anchor="middle" fill="#64748b" font-size="9">Claude opens</text>
  <text x="544" y="142" text-anchor="middle" fill="#64748b" font-size="9">a pull request</text>

  <rect x="598" y="50" width="88" height="110" rx="8" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="1"/>
  <text x="642" y="70" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700">PR</text>
  <text x="642" y="84" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700">(approved)</text>
  <text x="642" y="130" text-anchor="middle" fill="#64748b" font-size="9">PM reviews</text>
  <text x="642" y="142" text-anchor="middle" fill="#64748b" font-size="9">the code</text>

  <rect x="696" y="50" width="88" height="110" rx="8" fill="#16a34a" opacity="0.15" stroke="#16a34a" stroke-width="1"/>
